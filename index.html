     <!DOCTYPE html>
     <html lang="th">
     <head>
         <meta charset="UTF-8">
         <title>My App</title>
         <style>
             body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
             .iframe-container {
                 position: absolute;
                 top: -40px; /* ปรับตัวเลขนี้ตามความสูงแถบของ Google */
                 left: 0;
                 width: 100%;
                 height: calc(100% + 40px);
             }
             iframe { width: 100%; height: 100%; border: none; }
         </style>
     </head>
     <body>
         <div class="iframe-container">
             <iframe src="https://script.google.com/macros/s/AKfycbzmwpDuZTdFOSchkqr0MrbW49hXDySuwKhD-X54IOMbeZ7BU2ynOMesaEXteWNKoTUSQw/exec"></iframe>
         </div>
     </body>
